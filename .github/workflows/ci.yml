name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Lint und Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check stub tests tools
      - run: python -m pytest
